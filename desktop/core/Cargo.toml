[package]
name = "friendflix-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
regex = "1"
serde_json = "1"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
lru = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
httpmock = "0.7"
