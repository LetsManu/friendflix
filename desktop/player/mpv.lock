# The mpv build the Windows app ships (spec §6). desktop/scripts/fetch-mpv.ps1 downloads `url`, refuses it unless its
# SHA-256 equals `sha256`, and extracts mpv.exe (plus d3dcompiler_43.dll and licence texts) into desktop/app/mpv.
#
# Build:  shinchiro's mpv-winbuild-cmake build of 2026-10-18, mpv v0.41.0-1205-g01e2533f3 (git master), x86_64 (the
#         baseline x86-64 build, not -v3, so it runs on every 64-bit PC), 34.0 MB. Downloaded from shinchiro's
#         SourceForge project (mpv-player-windows/64bit), which keeps old builds; the GitHub releases of
#         shinchiro/mpv-winbuild-cmake are deleted after about 30 days. The MD5 SourceForge lists matched the download.
# Lua:    LuaJIT 2.1 is linked into mpv.exe (its strings name "LuaJIT 2.1.1792109291"; the archive has no lua5x.dll /
#         lua51.dll and mpv.exe imports none), so the skin (friendflix.lua, layout.lua) must stay LuaJIT / Lua 5.1
#         compatible; the desktop-core CI job checks it.
# Archive: mpv.exe, mpv.com, d3dcompiler_43.dll, doc/, installer/, mpv/fonts.conf and .bat helpers; no licence files.
#         mpv.exe imports vulkan-1.dll, which the GPU drivers install (as with every shinchiro build).
# Licence: GPL-2.0-or-later (mpv with GPL libraries); the texts are in desktop/player/licenses/.
# Re-pin: pick a current mpv-x86_64-<date>-git-<sha>.7z from https://sourceforge.net/projects/mpv-player-windows/files/64bit/,
#         set url (downloads.sourceforge.net form) and sha256 (sha256sum of the downloaded file), and update the lines
#         above (mpv version: `strings mpv.exe | grep '^mpv v'`; Lua: `strings mpv.exe | grep LuaJIT`).
