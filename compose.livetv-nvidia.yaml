# Optional override (NVIDIA NVENC): reserves one GPU for the livetv container; needs the NVIDIA Container Toolkit on the host (docs/livetv.md).
services:
  livetv:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
