<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>FriendFlix Probe</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body data-probe="1">
  <main>
    <h1>FriendFlix Probe</h1>
    <section id="opening" hidden>
      <p id="opening-text">Opening your server</p>
      <p class="hint">Hold the red button for one second to change the server.</p>
    </section>
    <form id="form" novalidate autocomplete="off" hidden>
      <label for="server">Server address</label>
      <input id="server" name="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="friend.example.com" tabindex="0">
      <p id="error" role="alert" class="error"></p>
      <button id="connect" type="submit" tabindex="0">Connect</button>
      <p class="hint">Press OK on the field to type with the TV keyboard. Up and Down move between the field and Connect.</p>
    </form>
  </main>
  <noscript><p class="error">FriendFlix needs JavaScript.</p></noscript>
  <script type="module" src="setup.js"></script>
</body>
</html>
