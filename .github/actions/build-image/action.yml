# Builds one FriendFlix image: everything that shapes an image's bytes lives here (build args, labels, outputs,
# SBOM/provenance, the BuildKit pin), so this file is an input of every image in the change map (.github/images.json).
# An image is built for its image commit (`commit`, `time`: the plan's images.<service>.commit / .time), never for the run
# commit: FF_IMAGE_COMMIT, SOURCE_DATE_EPOCH and the revision/created labels all come from it, so an image whose inputs did
# not change comes out byte-identical at a later commit. Only the backend bakes the version (version.json).
#   publish 'false'  build with load:true as friendflix-<service>:ci (no push, forks cannot write packages), gha cache
#   publish 'true'   build without cache import, push <image>:<tag> with SBOM + SLSA provenance (mode=max); the caller
#                    logs in to GHCR first
# Needs the repository checked out (context = the checkout). The caller scans and smoke-tests outputs.ref.
name: Build image
description: Builds one FriendFlix image (PR - local, publish - the ci-<sha> candidate in GHCR)
inputs:
  service:
    description: backend | gateway | web | updater | livetv | mediaserver (its Dockerfile is <service>/Dockerfile)
    required: true
  publish:
    description: "'true' pushes the candidate, 'false' builds locally"
    required: true
  commit:
    description: the image commit (40 hex, the plan's images.<service>.commit) - FF_IMAGE_COMMIT and the revision label
    required: true
  time:
    description: its commit time (Unix seconds, the plan's images.<service>.time) - SOURCE_DATE_EPOCH and the created label
    required: true
  image:
    description: image name without tag, ghcr.io/<owner>/<repo>-<service> (publish only)
    required: false
    default: ""
  tag:
    description: candidate tag, ci-<sha> (publish only)
    required: false
    default: ""
  mediaserver-pins:
    description: backend only - the media server pins, written as the label io.github.letsmanu.friendflix.mediaserver.pins (value only)
    required: false
    default: ""
  # BuildKit that builds every image, here and in scripts/reproduce-image.sh (which reads this line): the same commit only
  # yields the same bytes with the same BuildKit. Pinned by digest; Dependabot does not see it, bump tag + digest by hand.
  buildkit-image:
    description: BuildKit image of the builder
    required: false
    default: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
outputs:
  digest:
    description: pushed digest (publish only)
    value: ${{ steps.push.outputs.digest }}
  ref:
    description: what was built - <image>@<digest> (publish) or friendflix-<service>:ci (local)
    value: ${{ inputs.publish == 'true' && format('{0}@{1}', inputs.image, steps.push.outputs.digest) || format('friendflix-{0}:ci', inputs.service) }}
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        driver-opts: image=${{ inputs.buildkit-image }}
    # SOURCE_DATE_EPOCH = the image commit's time: image/history timestamps, rewrite-timestamp and the `created` label all
    # derive from it, never from the clock, so a rebuild of the same inputs reproduces them. FF_IMAGE_COMMIT = the image
    # commit. Only the backend bakes APP_VERSION / APP_CODENAME from version.json.
    # The OCI labels (published candidate only) are written here from git facts alone (no metadata-action: it read the
    # repository description and stamped `.version` = the run's ref): title, source, url, licenses, revision = the image
    # commit, created = its time; mediaserver its own title, description and licence; backend the media server pins.
    - name: Build arguments and labels (image commit, its time, version.json)
      id: ver
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        PUBLISH: ${{ inputs.publish }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        COMMIT: ${{ inputs.commit }}
        TIME: ${{ inputs.time }}
        PINS: ${{ inputs.mediaserver-pins }}
        REPOSITORY: ${{ github.repository }}
        # Ferrofin is GPL-3.0-only, not the repository's AGPL; the description names the README the image follows
        MEDIASERVER_TITLE: FriendFlix media server (Ferrofin)
        MEDIASERVER_DESCRIPTION: Ferrofin with FriendFlix's numbered changes (mediaserver/README.md). Trial.
        MEDIASERVER_LICENSES: GPL-3.0-only
      run: |
        set -euo pipefail
        case "$PUBLISH" in
          true) [ -n "$IMAGE" ] && [ -n "$TAG" ] || { echo "::error::build-image: publish needs image and tag"; exit 1; } ;;
          false) ;;
          *) echo "::error::build-image: publish must be 'true' or 'false', got '$PUBLISH'"; exit 1 ;;
        esac
        [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::build-image: commit must be 40 hex (the plan's image commit), got '$COMMIT'"; exit 1; }
        [[ "$TIME" =~ ^[1-9][0-9]*$ ]] || { echo "::error::build-image: time must be the image commit's Unix time, got '$TIME'"; exit 1; }
        case "$PINS" in *$'\n'* | *$'\r'*) echo "::error::build-image: mediaserver-pins contains a line break"; exit 1 ;; esac
        created=$(date -u -d "@$TIME" +%Y-%m-%dT%H:%M:%SZ)
        args=("SOURCE_DATE_EPOCH=$TIME" "FF_IMAGE_COMMIT=$COMMIT")
        if [ "$SERVICE" = backend ]; then
          args+=("APP_VERSION=$(jq -er .version version.json)" "APP_CODENAME=$(jq -er .codename version.json)")
        fi
        url="https://github.com/${REPOSITORY}"
        if [ "$SERVICE" = mediaserver ]; then
          labels=("org.opencontainers.image.title=$MEDIASERVER_TITLE" "org.opencontainers.image.description=$MEDIASERVER_DESCRIPTION" "org.opencontainers.image.licenses=$MEDIASERVER_LICENSES")
        else
          labels=("org.opencontainers.image.title=friendflix-$SERVICE" "org.opencontainers.image.licenses=AGPL-3.0-or-later")
        fi
        labels+=("org.opencontainers.image.source=$url" "org.opencontainers.image.url=$url" "org.opencontainers.image.revision=$COMMIT" "org.opencontainers.image.created=$created")
        if [ "$SERVICE" = backend ] && [ -n "$PINS" ]; then
          labels+=("io.github.letsmanu.friendflix.mediaserver.pins=$PINS")
        fi
        echo "image commit $COMMIT, SOURCE_DATE_EPOCH $TIME ($created)"
        {
          echo "args<<FF_BUILD_ARGS"
          printf '%s\n' "${args[@]}"
          echo "FF_BUILD_ARGS"
          echo "labels<<FF_LABELS"
          printf '%s\n' "${labels[@]}"
          echo "FF_LABELS"
        } >> "$GITHUB_OUTPUT"
    # ---- publish 'false': build locally, the caller scans and discards ----
    - name: Build (PR / other dispatch, not pushed)
      if: inputs.publish != 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ${{ inputs.service }}/Dockerfile
        platforms: ${{ inputs.service == 'mediaserver' && 'linux/amd64' || '' }}
        load: true
        tags: friendflix-${{ inputs.service }}:ci
        build-args: ${{ steps.ver.outputs.args }}
        cache-from: type=gha,scope=${{ inputs.service }}
        cache-to: type=gha,mode=max,scope=${{ inputs.service }}
    # ---- publish 'true': build once, push the candidate tag ----
    - name: Build and push candidate
      id: push
      if: inputs.publish == 'true'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: ${{ inputs.service }}/Dockerfile
        platforms: linux/amd64
        # push = image exporter; rewrite-timestamp clamps every file mtime to SOURCE_DATE_EPOCH (reproducible layers)
        outputs: type=image,name=${{ inputs.image }}:${{ inputs.tag }},push=true,oci-mediatypes=true,compression=gzip,rewrite-timestamp=true
        labels: ${{ steps.ver.outputs.labels }}
        build-args: ${{ steps.ver.outputs.args }}
        # No cache import for what gets published: rewrite-timestamp only clamps mtimes NEWER than SOURCE_DATE_EPOCH, so
        # a layer reused from an older commit's cache keeps that build's (older) mtimes and the image would differ from
        # a clean rebuild. The fresh layers are still exported as cache for PR builds.
        no-cache: true
        cache-to: type=gha,mode=max,scope=${{ inputs.service }}
        # SPDX SBOM + full SLSA provenance stored next to the image (index digest); publish.yml re-uses the SBOM.
        # They are separate manifests in the index (with build times); the linux/amd64 image manifest is what reproduces.
        sbom: true
        provenance: mode=max
