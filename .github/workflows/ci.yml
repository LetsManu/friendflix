# SPDX-License-Identifier: AGPL-3.0-or-later
# CI flow: test + secrets scan + image build/scan, then (push only) publish.
# Images are built exactly ONCE, in the `docker` job:
#   pull_request     build with load:true (no push, forks cannot write packages) and scan the local image.
#   push (main, v*)  build, push as ghcr.io/<owner>/friendflix-<svc>:ci-<git sha> and scan that exact digest with trivy.
# publish.yml (called after test, secrets and docker all passed) does NOT rebuild: it only re-tags the already scanned
# image (`docker buildx imagetools create`) to nightly (main) / latest (highest release) / short sha / semver. What gets
# released is what was scanned.
# A failed scan leaves only the unreleased `ci-<sha>` tag in GHCR (never latest); prune old ci-* tags from time to time.
# Supply chain (push only): the candidate carries BuildKit SBOM (SPDX) + SLSA provenance (mode=max) attestations, Trivy
# findings go to code scanning as SARIF, and publish.yml signs the promoted digest with cosign keyless (GitHub OIDC) and
# adds GitHub artifact attestations (provenance + SBOM). Nothing on pull_request can write packages, sign or attest.
# DAST: `dast` runs an OWASP ZAP baseline scan against the built web app (rules: .zap/rules.tsv).
# workflow_dispatch: release.yml starts CI for the new vX.Y.Z tag (its own pushes use GITHUB_TOKEN and trigger nothing);
# a dispatch behaves like a push of that ref, but only main and v* tags are ever published.
# v* tags also get the signed Android app and the Fire TV APK (android-release.yml), the Windows app (desktop-release.yml)
# and the Samsung TV app (tizen-release.yml) attached to their GitHub Release.
# The build itself (build args, labels, PR load + cache, push with SBOM/provenance, the pinned BuildKit) lives in the
# composite action .github/actions/build-image, which every image job calls: it is an input of every image in the change
# map (.github/images.json), so a change to how images are built counts as a change of every image.
# Each image is built for its image commit (the newest commit that changed its inputs, from the change plan): it carries
# FF_IMAGE_COMMIT and the revision label = that commit, never the run commit; only the backend also carries APP_VERSION /
# APP_CODENAME from version.json.
# Reproducible builds (docs/reproducible-builds.md): SOURCE_DATE_EPOCH = the image commit's time, rewrite-timestamp=true,
# pinned BuildKit (the action's `buildkit-image` default), the `created` label derived from that time; the published
# candidate is built without cache import. The `reproducible` job rebuilds every image from scratch and requires the same
# digest.
# `changes` (first job) prints the change plan (scripts/changed-images.mjs): per image build or carry, its image commit and
# time, and the test classes, to its log and step summary. `docker`, `mediaserver-image` and `reproducible` read each image's
# commit and time from it and fail without a valid plan (step `Plan`); every image still builds and every job runs in full.
# On publishable runs the plan also walks back to the newest main commit whose images were all published (`sha-<7>`) and says
# per image "carry" when that base is signed by this repository (cosign, the updater's identity rule) and its revision label is the
# image commit (report only: nothing acts on it yet). The `reproducible (x)` legs then run the burn-in: the fresh rebuild against
# that base, as annotations only (scripts/burnin-status.sh counts them; CI carries images after 20 counting main runs).
# mediaserver (trial, mediaserver/README.md) is the thin FriendFlix image on top of the pinned Ferrofin release: no Rust or
# Node build, only image-level changes. It has its OWN jobs (`mediaserver-image`, `publish-mediaserver`) that nothing else
# needs, so it can never block or cancel the other images: built, SBOM'd, signed and published the same way, but its Trivy
# scan only reports (CVEs of the third-party base can only be fixed by a Ferrofin release) and it is exempt from `reproducible`.
# Neither job is a required status check (docs/operations.md).
name: CI
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
# A newer run on the same branch or PR supersedes an older one. Pull requests cancel the run in progress; main never
# cancels a running publish, it only drops a run still waiting (the newer commit publishes nightly anyway). Every tag
# keeps its own group, so each release is published.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: { contents: read }
jobs:
  # The change plan (scripts/changed-images.mjs, map .github/images.json) as one JSON line in the output `plan` and as a
  # table in the step summary. Pull requests compare the image commits at the merge commit with those at the PR base;
  # other events build everything. Full history: an image commit is the newest commit that touched the image's inputs.
  # Publishable runs (report only, Stage C): the base walk reads GHCR (`sha-<7>` digests, revision labels) and verifies each base
  # with cosign. A login, install, registry or cosign failure only costs the base ("keine Basis" and a warning, never a failed plan).
  changes:
    # until Stage D (D2 removes this). It no longer hides a failure: the jobs that read the plan (docker, mediaserver-image,
    # reproducible) fail closed without a valid one in their step Plan.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, packages: read }
    env:
      PUBLISHABLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - name: Log in to GHCR
        if: env.PUBLISHABLE == 'true'
        continue-on-error: true # without it the plan has no base (registry error), it never fails
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - if: env.PUBLISHABLE == 'true'
        continue-on-error: true # without cosign every base is "keine Basis"
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Plan
        id: plan
        env:
          # empty outside pull requests (= no base)
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          registry=()
          if [ "$PUBLISHABLE" = true ]; then
            repo="${GITHUB_REPOSITORY#*/}"
            registry=(--registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}" --repo "$GITHUB_REPOSITORY")
          fi
          plan=$(node scripts/changed-images.mjs plan --event "$GITHUB_EVENT_NAME" --sha "$GITHUB_SHA" --pr-base "$PR_BASE" --summary "$GITHUB_STEP_SUMMARY" ${registry[@]+"${registry[@]}"})
          echo "$plan"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-latest
    strategy:
      # 22 = oldest supported (engines >=22), 26 = runtime of all images
      matrix: { node: [22, 26] }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_USER: postgres, POSTGRES_DB: ff_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run spdx:check
      - run: npm run typecheck
      # one image set for both media servers: npm test runs the Jellyfin and the Plex adapter suites (backend/test/plex against the
      # fake Plex server, gateway/test/plex.test.ts); this guard fails if a config change ever drops one of them
      - name: Both media adapter suites are collected
        run: |
          test "$(cd backend && npx vitest list --filesOnly | grep -c 'test/plex/')" -ge 20
          (cd backend && npx vitest list --filesOnly | grep -q 'test/media-seam.test.ts')
          (cd gateway && npx vitest list --filesOnly | grep -q 'test/plex.test.ts')
      # newest Node: tests run once, with coverage (fails below the thresholds in each vitest.config.ts); other entries run plain tests
      - run: npm test
        if: matrix.node != 26
      - name: Tests with coverage
        if: matrix.node == 26
        run: npm run coverage && npm run test:scripts
      - name: Coverage summary
        if: matrix.node == 26
        run: |
          {
            echo "## Test coverage"
            echo "| Package | Statements | Branches | Functions | Lines |"
            echo "|---|---|---|---|---|"
            for pkg in backend gateway web updater livetv; do
              jq -r --arg p "$pkg" '.total | "| \($p) | \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"' "$pkg/coverage/coverage-summary.json"
            done
            # overall: covered / total summed over the five packages
            jq -s -r 'def pct(k): (([.[].total[k].covered] | add) * 10000 / ([.[].total[k].total] | add) | floor) / 100; "| **overall** | \(pct("statements"))% | \(pct("branches"))% | \(pct("functions"))% | \(pct("lines"))% |"' backend/coverage/coverage-summary.json gateway/coverage/coverage-summary.json web/coverage/coverage-summary.json updater/coverage/coverage-summary.json livetv/coverage/coverage-summary.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.node == 26
        with:
          name: coverage
          path: |
            backend/coverage/
            gateway/coverage/
            web/coverage/
            updater/coverage/
            livetv/coverage/
          retention-days: 14
      - name: Dependency audit (prod, high+)
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
  # browser tests against the built web app with a fully mocked API (no backend, Postgres or Jellyfin needed)
  e2e:
    runs-on: ubuntu-latest
    # the suite took ~26 min before the recordings specs landed and now runs past 30: room for growth until it is sharded
    timeout-minutes: 45
    env: { E2E_SKIP_BUILD: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm } # same as the web image
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -w web
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
  # OWASP ZAP baseline (passive) scan against the built web app, started like in `e2e` (node web/server, no backend).
  # Fails on High-risk alerts, Medium/Low become warnings. Suppressions with reasons: .zap/rules.tsv. Report: artifact `zap-report`.
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # pinned by digest; bump together with the tag (Dependabot does not update `docker run` lines)
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
      TARGET: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm } # same as the web image
      - run: npm ci
      - run: npm run build -w web
      - name: Start web app
        run: |
          PORT=4173 HOST=127.0.0.1 ORIGIN="$TARGET" nohup node web/server > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS -o /dev/null "$TARGET/offline" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap   # the ZAP container runs as uid 1000
          cp .zap/rules.tsv zap/rules.tsv
          docker pull -q "$ZAP_IMAGE"
          # -I: warnings never fail here; the gate below decides. Exit 1 = a rule set to FAIL in rules.tsv, 3 = scan error.
          rc=0
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET" -c rules.tsv -I -r zap-report.html -J zap-report.json -w zap-report.md || rc=$?
          [ -s zap/zap-report.json ] || { echo "::error::ZAP produced no report (exit $rc)"; exit 1; }
          [ "$rc" -le 2 ] || { echo "::error::ZAP baseline failed (exit $rc)"; exit "$rc"; }
          [ "$rc" -ne 1 ] || { echo "::error::ZAP: a rule configured as FAIL in .zap/rules.tsv matched"; exit 1; }
      - name: Gate (fail on High, warn on Medium)
        run: |
          ignored=$(awk -F'\t' '!/^#/ && $2 == "IGNORE" { print $1 }' .zap/rules.tsv | jq -R . | jq -sc .)
          alerts=$(jq -c --argjson ign "$ignored" '[.site[].alerts[] | select((.pluginid | tostring) as $id | $ign | index($id) | not)]' zap/zap-report.json)
          jq -r '.[] | select(.riskcode == "2" or .riskcode == "1") | "::warning title=ZAP \(.riskdesc)::\(.name) [\(.pluginid)] (\(.count) URLs)"' <<< "$alerts"
          high=$(jq '[.[] | select(.riskcode == "3")]' <<< "$alerts")
          if [ "$(jq length <<< "$high")" -gt 0 ]; then
            jq -r '.[] | "::error title=ZAP \(.riskdesc)::\(.name) [\(.pluginid)] (\(.count) URLs)"' <<< "$high"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  # The Samsung TV (Tizen) shells: config.xml checks (ids, privileges, required version, icon), the setup-core and script
  # tests, and a .wgt of app and probe built with the pinned Tizen CLI to catch packaging errors. That build is signed with
  # a throwaway author certificate made here (no secrets on pull requests) and installs on no TV. Not a dependency of
  # publish or android-release; the signed .wgt build is tizen-release.
  tizen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node tizen/check-config.mjs
      - run: npm run test:tizen
      - run: npm run test:tvshared
      - name: Install the pinned Tizen CLI
        run: bash tizen/scripts/install-cli.sh "$RUNNER_TEMP/tizen-studio"
      - name: Unsigned package (throwaway author certificate)
        run: |
          set -euo pipefail
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          mkdir -p "$RUNNER_TEMP/ci-cert"
          tizen certificate -a friendflix-ci -p "$pw" -f author -- "$RUNNER_TEMP/ci-cert" > /dev/null
          AUTHOR_PW=$pw bash tizen/scripts/add-profile.sh friendflix-dev "$RUNNER_TEMP/ci-cert/author.p12"
          bash tizen/scripts/package.sh app "$RUNNER_TEMP/wgt"
          bash tizen/scripts/package.sh probe "$RUNNER_TEMP/wgt"
          for f in "$RUNNER_TEMP"/wgt/*.wgt; do
            listing=$(unzip -l "$f")
            echo "$listing"
            for need in config.xml index.html setup.js setup-core.js setup.css icon.png; do
              grep -q " $need\$" <<< "$listing" || { echo "::error::$need missing in $(basename "$f")"; exit 1; }
            done
          done
  # The LG webOS TV shells: appinfo.json checks, the setup-core and script tests, and an .ipk of app and probe built with the
  # pinned LG ares CLI (webos/package.json, installed outside the root workspaces) to catch packaging errors. No secrets
  # and no signing; developer-mode packages. Not a dependency of publish or android-release; the release build is webos-release.
  webos-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: node webos/check-config.mjs
      - run: npm run test:webos
      - run: npm run test:tvshared
      - name: Install the pinned ares CLI
        run: npm ci --prefix webos --ignore-scripts --no-audit --no-fund
      - name: Build app and probe
        run: |
          set -euo pipefail
          node webos/build.mjs app "$RUNNER_TEMP/ipk"
          node webos/build.mjs probe "$RUNNER_TEMP/ipk"
          bash webos/scripts/check-ipk.sh "$RUNNER_TEMP/ipk"
  # The Windows app's platform-independent core (origin policy, bridge protocol); the Tauri app itself is built elsewhere.
  desktop-core:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - run: cargo fmt --check
      - run: cargo clippy --locked -p friendflix-core -- -D warnings
      - run: cargo test --locked -p friendflix-core
      - name: mpv control skin (Lua)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luajit
          lua5.4 desktop/player/test/layout_test.lua
          luac5.4 -p desktop/player/layout.lua desktop/player/friendflix.lua
          # the pinned mpv embeds LuaJIT (Lua 5.1 syntax: no //, no bitwise operators, no goto)
          luajit desktop/player/test/layout_test.lua
          for f in desktop/player/layout.lua desktop/player/friendflix.lua; do luajit -bl "$f" > /dev/null; done
  # The Windows app (desktop/app, Tauri 2 + WebView2): lint, unit tests and a debug build on Windows. No installer and no
  # mpv here; the signed release build is desktop-release.yml.
  desktop-app:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - run: cargo clippy --locked -p friendflix-app -- -D warnings
      - run: cargo test --locked -p friendflix-app
      - run: cargo build --locked -p friendflix-app
  # A new install needs no .env, an existing one keeps working with its .env: both compose files must render either way,
  # with and without the opt-in profiles (backup, bundled) and with and without the updater (compose.no-updater.yaml)
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compose config without .env
        run: |
          test ! -e .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml --profile backup --profile bundled config -q
          docker compose -f compose.prod.yaml config -q
          docker compose -f compose.prod.yaml --profile backup --profile bundled config -q
          docker compose -f compose.prod.yaml -f compose.no-updater.yaml config -q
          docker compose -f compose.prod.yaml -f compose.no-updater.yaml --profile updater config -q
          docker compose -f compose.prod.yaml -f compose.plex.yaml config -q
          docker compose -f compose.prod.yaml -f compose.plex.yaml -f compose.no-updater.yaml config -q
          docker compose -f compose.prod.yaml -f compose.secrets.yaml config -q
          docker compose -f compose.yaml -f compose.plex.yaml config -q
          # the updater (and its socket proxy) start by default, also with Plex; compose.no-updater.yaml turns both off
          docker compose -f compose.prod.yaml config --services | grep -qx updater
          docker compose -f compose.prod.yaml config --services | grep -qx docker-proxy
          docker compose -f compose.prod.yaml -f compose.plex.yaml config --services | grep -qx updater
          test -z "$(docker compose -f compose.prod.yaml -f compose.no-updater.yaml config --services | grep -E '^(updater|docker-proxy)$' || true)"
          test -z "$(docker compose -f compose.prod.yaml -f compose.plex.yaml -f compose.no-updater.yaml config --services | grep -E '^(updater|docker-proxy)$' || true)"
          # the Plex override sets MEDIA_SERVER=plex for backend + gateway; the updater takes the stack's own files (no fixed list)
          docker compose -f compose.prod.yaml -f compose.plex.yaml config | grep -q 'UPDATER_COMPOSE_FILES: ""'
          test "$(docker compose -f compose.prod.yaml -f compose.plex.yaml config | grep -c 'MEDIA_SERVER: plex')" = 2
          # Live TV (optional profile): the service does not exist without it, renders with it, and the GPU overlays render too
          docker compose -f compose.prod.yaml --profile livetv config -q
          docker compose -f compose.yaml --profile livetv config -q
          RENDER_GID=109 docker compose -f compose.prod.yaml -f compose.livetv-gpu.yaml --profile livetv config -q
          docker compose -f compose.prod.yaml -f compose.livetv-nvidia.yaml --profile livetv config -q
          RECORDINGS_LIBRARY_PATH=/srv/media/Aufnahmen docker compose -f compose.prod.yaml -f compose.livetv-library.yaml --profile livetv config -q
          test -z "$(docker compose -f compose.prod.yaml config --services | grep -x livetv || true)"
          test -z "$(docker compose -f compose.yaml config --services | grep -x livetv || true)"
          docker compose -f compose.prod.yaml --profile livetv config --services | grep -qx livetv
          # Redis keeps sign-ins across a reboot: append-only file on the redis-data volume, with each stack alone and compose.prod.yaml
          # under every overlay found (compose.*.yaml; placeholder values only for the variables the optional overlays require)
          redis_ok='.services.redis as $r | ($r.command | index("--appendonly")) as $i | $r.command[$i + 1] == "yes" and $r.read_only == true and ([$r.volumes[] | select(.source == "redis-data" and .target == "/data")] | length) == 1'
          docker compose -f compose.yaml config --format json | jq -e "$redis_ok" > /dev/null
          docker compose -f compose.prod.yaml config --format json | jq -e "$redis_ok" > /dev/null
          for o in compose.*.yaml; do
            [ "$o" = compose.prod.yaml ] && continue
            RENDER_GID=109 RECORDINGS_LIBRARY_PATH=/srv/media/Aufnahmen AUTHENTIK_PG_PASSWORD=x AUTHENTIK_SECRET_KEY=x GRAFANA_ADMIN_PASSWORD=x \
              docker compose -f compose.prod.yaml -f "$o" --profile livetv config --format json | jq -e "$redis_ok" > /dev/null || { echo "redis not persistent with $o"; exit 1; }
          done
      - name: Compose config with .env.example
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config -q
          docker compose -f compose.yaml --profile backup --profile bundled config -q
          docker compose -f compose.prod.yaml config -q
          docker compose -f compose.prod.yaml --profile backup --profile bundled config -q
          docker compose -f compose.prod.yaml -f compose.no-updater.yaml config -q
          docker compose -f compose.prod.yaml -f compose.no-updater.yaml --profile updater config -q
          docker compose -f compose.prod.yaml -f compose.plex.yaml config -q
          docker compose -f compose.prod.yaml -f compose.plex.yaml -f compose.no-updater.yaml config -q
          docker compose -f compose.prod.yaml -f compose.secrets.yaml config -q
          docker compose -f compose.yaml -f compose.plex.yaml config -q
          # the updater (and its socket proxy) start by default, also with Plex; compose.no-updater.yaml turns both off
          docker compose -f compose.prod.yaml config --services | grep -qx updater
          docker compose -f compose.prod.yaml config --services | grep -qx docker-proxy
          docker compose -f compose.prod.yaml -f compose.plex.yaml config --services | grep -qx updater
          test -z "$(docker compose -f compose.prod.yaml -f compose.no-updater.yaml config --services | grep -E '^(updater|docker-proxy)$' || true)"
          test -z "$(docker compose -f compose.prod.yaml -f compose.plex.yaml -f compose.no-updater.yaml config --services | grep -E '^(updater|docker-proxy)$' || true)"
          # the Plex override sets MEDIA_SERVER=plex for backend + gateway; the updater takes the stack's own files (no fixed list)
          docker compose -f compose.prod.yaml -f compose.plex.yaml config | grep -q 'UPDATER_COMPOSE_FILES: ""'
          test "$(docker compose -f compose.prod.yaml -f compose.plex.yaml config | grep -c 'MEDIA_SERVER: plex')" = 2
          # Live TV (optional profile): the service does not exist without it, renders with it, and the GPU overlays render too
          docker compose -f compose.prod.yaml --profile livetv config -q
          docker compose -f compose.yaml --profile livetv config -q
          RENDER_GID=109 docker compose -f compose.prod.yaml -f compose.livetv-gpu.yaml --profile livetv config -q
          docker compose -f compose.prod.yaml -f compose.livetv-nvidia.yaml --profile livetv config -q
          RECORDINGS_LIBRARY_PATH=/srv/media/Aufnahmen docker compose -f compose.prod.yaml -f compose.livetv-library.yaml --profile livetv config -q
          test -z "$(docker compose -f compose.prod.yaml config --services | grep -x livetv || true)"
          test -z "$(docker compose -f compose.yaml config --services | grep -x livetv || true)"
          docker compose -f compose.prod.yaml --profile livetv config --services | grep -qx livetv
          rm .env
      - name: Media server pins script
        run: bash scripts/mediaserver-pins.test.sh
  docker:
    runs-on: ubuntu-latest
    # Waits for `mediaserver-image` only so the backend image can carry that image's digest in its pin label (the updater reads
    # the pins from the backend image, which cosign signs with the build). `!cancelled()` keeps every image building when that
    # job failed or was skipped: the label then has no ferrofin entry and the updater treats Ferrofin as not pinned. This is the
    # one wait between the two job families; the ci-changed-only project (Stage D) removes it with its own reuse of the digest.
    # `changes`: the image commit and its time come from the plan (step Plan fails closed without one).
    needs: [changes, mediaserver-image]
    if: ${{ !cancelled() }}
    # push events upload the candidate image to GHCR; PRs only build+scan locally
    permissions:
      contents: read
      packages: write # literal on purpose: permissions don't accept expressions; PRs never push and fork PRs get a read-only token anyway
      security-events: write # Trivy SARIF upload (push only, same reasoning)
    strategy:
      matrix: { service: [backend, gateway, web, updater, livetv] }
    env:
      SERVICE: ${{ matrix.service }}
      # push (main / v* tags) or a dispatch on main / a v* tag: push the candidate to GHCR; everything else builds locally
      PUBLISHABLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      # The change plan, checked before anything else (it runs before checkout): a plan that is missing, failed or does not
      # parse turns this job red, never skipped or green. The same step, byte for byte, in every job that reads the plan.
      - name: Plan
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ] || ! jq -e '.images' <<< "$PLAN" > /dev/null; then
            echo "::error::kein gültiger Plan (changes: $CHANGES_RESULT)"
            exit 1
          fi
          jq -c '.images | map_values({action, commit, time})' <<< "$PLAN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image name (GHCR needs lowercase)
        id: img
        run: repo="${GITHUB_REPOSITORY#*/}"; echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${SERVICE}" >> "$GITHUB_OUTPUT"   # friendflix-<svc>; forks get <repo>-<svc>
      - name: Log in to GHCR
        if: env.PUBLISHABLE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # backend only: the media server pins (the Jellyfin pin file + the Ferrofin candidate's digest), written by the build action
      # as the backend image's label. Also runs on PRs, so a malformed pin file fails there. A newline would add extra labels.
      - name: Media server pins (backend label)
        id: pins
        if: matrix.service == 'backend'
        env:
          FERROFIN_DIGEST: ${{ needs.mediaserver-image.outputs.digest }}
        run: |
          set -euo pipefail
          pins=$(bash scripts/mediaserver-pins.sh "$GITHUB_REPOSITORY" "$FERROFIN_DIGEST")
          case "$pins" in
            '' | *$'\n'* | *$'\r'*) echo "::error::the media server pins are empty or contain a line break"; exit 1 ;;
          esac
          echo "pins: $pins"
          echo "value=$pins" >> "$GITHUB_OUTPUT"
      # pull_request / other dispatch: local friendflix-<svc>:ci; push (main / v* tags) or publishable dispatch: built once,
      # pushed as the candidate ci-<sha> (outputs.ref = that exact digest). Built for the image commit of the plan.
      - name: Build
        id: build
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          publish: ${{ env.PUBLISHABLE }}
          image: ${{ steps.img.outputs.name }}
          tag: ci-${{ github.sha }}
          commit: ${{ fromJSON(needs.changes.outputs.plan).images[matrix.service].commit }}
          time: ${{ fromJSON(needs.changes.outputs.plan).images[matrix.service].time }}
          mediaserver-pins: ${{ steps.pins.outputs.value }}
      # ---- pull_request: scan the local image, discard ----
      - name: Scan (PR / other dispatch)
        if: env.PUBLISHABLE != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # ---- push (main / v* tags) or dispatch: scan the pushed candidate's exact digest ----
      # report first (never fails) so code scanning also gets the findings of a run that the gate below fails
      - name: Scan pushed digest (SARIF for code scanning)
        if: env.PUBLISHABLE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: env.PUBLISHABLE == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
      - name: Scan pushed digest (gate)
        if: env.PUBLISHABLE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          format: table
          output: ""
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      # backend only: every production dependency resolves inside the image (a package npm kept in backend/node_modules once shipped
      # missing: the backend crashed at start with ERR_MODULE_NOT_FOUND)
      - name: Smoke test (backend image resolves its dependencies)
        if: matrix.service == 'backend'
        env:
          IMAGE: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm -w /app/backend --entrypoint node "$IMAGE" --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            const missing = Object.keys(pkg.dependencies ?? {}).filter((n) => { try { import.meta.resolve(n); return false; } catch { return true; } });
            if (missing.length) { console.error('::error::backend image cannot resolve: ' + missing.join(', ')); process.exit(1); }
            console.log('all ' + Object.keys(pkg.dependencies ?? {}).length + ' backend dependencies resolve');
          "
      # updater only: the media server helper in this image (busybox tar) backs up and restores byte-equal, stops cleanly at the end
      # of the archive, refuses a hostile archive without writing anything, and runs when started through a symlink
      # (scripts/mediahelper-smoke.sh)
      - name: Smoke test (updater image media helper backup and restore)
        if: matrix.service == 'updater'
        env:
          IMAGE: ${{ steps.build.outputs.ref }}
        run: bash scripts/mediahelper-smoke.sh "$IMAGE"
      # web only: the image starts without any backend and serves its static files with the security headers (web/server/index.js)
      - name: Smoke test (web image serves static files with security headers)
        if: matrix.service == 'web'
        env:
          IMAGE: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          docker run -d --name web-smoke -e PROTOCOL_HEADER=x-forwarded-proto -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs web-smoke || true; docker rm -f web-smoke > /dev/null' EXIT
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            [ "$i" -lt 30 ] || { echo "::error::web image did not answer within 30 s"; exit 1; }
            sleep 1
          done
          headers=$(curl -fsSI http://127.0.0.1:3000/favicon.svg)
          echo "$headers"
          for h in 'x-content-type-options: *nosniff' 'cross-origin-resource-policy: *[a-z]'; do
            grep -iqE "^${h}" <<< "$headers" || { echo "::error::missing header ${h%%:*} on /favicon.svg"; exit 1; }
          done
  # The trial media server image (mediaserver/README.md), on its own: nothing in this workflow needs this job, so a failed
  # build or download here never blocks or cancels the other images or their publish. Same build as the `docker` job (PR:
  # local build + scan; push / publishable dispatch: candidate ci-<sha> with SBOM + provenance, no cache import), but Trivy
  # only REPORTS: table on every run, SARIF to code scanning on push. linux/amd64 only (Ferrofin publishes nothing else).
  # Not a required status check (docs/operations.md) and exempt from `reproducible` (docs/reproducible-builds.md).
  mediaserver-image:
    runs-on: ubuntu-latest
    # the image commit and its time come from the plan (step Plan fails closed without one)
    needs: changes
    if: ${{ !cancelled() }}
    # the pushed digest (publishable runs only; empty otherwise, and empty when the smoke test failed): the backend image's pin
    # label names it
    outputs:
      digest: ${{ steps.smoke.outcome == 'success' && steps.build.outputs.digest || '' }}
    permissions:
      contents: read
      packages: write # same reasoning as `docker`: PRs never push, fork PRs get a read-only token
      security-events: write # Trivy SARIF upload (push only)
    env:
      SERVICE: mediaserver
      PUBLISHABLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      # The change plan, checked before anything else (it runs before checkout): a plan that is missing, failed or does not
      # parse turns this job red, never skipped or green. The same step, byte for byte, in every job that reads the plan.
      - name: Plan
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ] || ! jq -e '.images' <<< "$PLAN" > /dev/null; then
            echo "::error::kein gültiger Plan (changes: $CHANGES_RESULT)"
            exit 1
          fi
          jq -c '.images | map_values({action, commit, time})' <<< "$PLAN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Dependabot bumps only the FROM line: a bump is complete only when the labels, NOTICE and both scripts name the same
      # Ferrofin tag and digest (mediaserver/README.md "New Ferrofin release")
      - name: Base image pinned the same everywhere (FROM, labels, NOTICE, try.sh, probe.sh)
        run: |
          set -euo pipefail
          from=$(sed -n 's|^FROM \(ghcr\.io/mangoleaf/ferrofin:[^ @]*@sha256:[0-9a-f]\{64\}\)$|\1|p' mediaserver/Dockerfile)
          [ "$(grep -c . <<< "$from")" = 1 ] || { echo "::error file=mediaserver/Dockerfile::expected exactly one FROM ghcr.io/mangoleaf/ferrofin:<tag>@sha256:<digest>"; exit 1; }
          ref=${from%@*} digest=${from#*@}
          tag=${ref##*:} fail=0
          need() { grep -qF -- "$2" "$1" || { echo "::error file=$1::does not name $2 (the Dockerfile's FROM is $from)"; fail=1; }; }
          need mediaserver/Dockerfile "org.opencontainers.image.base.name=\"$ref\""
          need mediaserver/Dockerfile "org.opencontainers.image.base.digest=\"$digest\""
          need mediaserver/Dockerfile "io.github.letsmanu.friendflix.mediaserver.ferrofin=\"$tag\""
          need mediaserver/NOTICE "$ref"
          need mediaserver/NOTICE "$digest"
          for s in mediaserver/try.sh mediaserver/probe.sh; do need "$s" "UPSTREAM_IMAGE=\"$from\""; done
          # no other Ferrofin tag or digest left in those files
          while IFS= read -r r; do
            [ "$r" = "$ref" ] || [ "$r" = "$from" ] || { echo "::error::stale reference $r (the Dockerfile's FROM is $from)"; fail=1; }
          done < <(grep -rhoE 'ghcr\.io/mangoleaf/ferrofin:[^ "@]+(@sha256:[0-9a-f]{64})?' mediaserver/Dockerfile mediaserver/NOTICE mediaserver/try.sh mediaserver/probe.sh)
          [ "$fail" = 0 ] && echo "base image pinned consistently: $from"
          exit "$fail"
      - name: Image name (GHCR needs lowercase)
        id: img
        run: repo="${GITHUB_REPOSITORY#*/}"; echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${SERVICE}" >> "$GITHUB_OUTPUT"   # friendflix-mediaserver
      - name: Log in to GHCR
        if: env.PUBLISHABLE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # the same build action as `docker` (mediaserver: linux/amd64, only SOURCE_DATE_EPOCH + FF_IMAGE_COMMIT, its own labels)
      - name: Build
        id: build
        uses: ./.github/actions/build-image
        with:
          service: mediaserver
          publish: ${{ env.PUBLISHABLE }}
          image: ${{ steps.img.outputs.name }}
          tag: ci-${{ github.sha }}
          commit: ${{ fromJSON(needs.changes.outputs.plan).images.mediaserver.commit }}
          time: ${{ fromJSON(needs.changes.outputs.plan).images.mediaserver.time }}
      # Runs the image as the updater's container template does (read-only root, no capabilities, fresh named volumes, a uid other
      # than the image's): the API answers, /web/ is 404 (change 0004), health turns healthy (0003), /data and /cache are
      # writable (0005); compares its `docker inspect` with the updater's inspect fixture (scripts/mediaserver-smoke.sh).
      # Fails the job (and so the publish of this image), on PRs and pushes alike.
      - name: Smoke test (runs as the managed media server)
        id: smoke
        env:
          IMAGE: ${{ steps.build.outputs.ref }}
        run: bash scripts/mediaserver-smoke.sh "$IMAGE"
      # ---- pull_request / other dispatch: report on the local image, discard ----
      - name: Scan (PR / other dispatch, report only)
        if: env.PUBLISHABLE != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
      # ---- push (main / v* tags) or dispatch: report on the pushed candidate's exact digest ----
      - name: Scan pushed digest (SARIF for code scanning)
        if: env.PUBLISHABLE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          format: sarif
          output: trivy-mediaserver.sarif
          severity: CRITICAL,HIGH,MEDIUM
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: env.PUBLISHABLE == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-mediaserver.sarif
          category: trivy-mediaserver
      - name: Scan pushed digest (table, report only)
        if: env.PUBLISHABLE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.build.outputs.ref }}
          format: table
          output: ""
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true
  # Reproducible builds (OpenSSF build_reproducible, docs/reproducible-builds.md): each image is rebuilt from scratch by
  # scripts/reproduce-image.sh (fresh docker-container builder with the build action's BuildKit pin, --no-cache, context =
  # git archive, FF_IMAGE_COMMIT = the image commit, SOURCE_DATE_EPOCH = its commit time, rewrite-timestamp, no
  # SBOM/provenance) and its image manifest digest must match:
  #   push / publishable dispatch  the ci-<sha> candidate the docker job pushed (other runner, minutes earlier; built at its
  #                                revision label = the image commit, its labels and build-arg ENVs are copied, see the
  #                                script) - proves the published bytes reproduce
  #   pull_request / other         a second rebuild in another fresh builder (two clean builds, compared)
  # Full history (the image commit and its time come from git) and Node (the script asks the ref's own
  # scripts/changed-images.mjs for the image commit).
  # Runs on PRs too (per service in parallel, only after `docker` passed) so a change that breaks reproducibility is caught
  # before merge, and publish waits for it. Attestations are not compared: they are separate manifests carrying build times.
  # livetv is NOT in this matrix (documented exemption): its runtime stage installs jellyfin-ffmpeg7 with apt from the live
  # Jellyfin repository (Debian + third-party packages, dpkg state, no snapshot archive; the repository keeps only current
  # versions), which this job cannot show to reproduce bit for bit. It is still built, scanned, SBOM'd and signed by the
  # `docker` matrix and publish; base images are digest-pinned. See scripts/reproduce-image.sh and docs/livetv.md.
  # mediaserver is NOT in this matrix either (documented exemption, docs/reproducible-builds.md): a third-party base image plus
  # dpkg-installed Intel debs; two identical builds have not been shown yet.
  # Burn-in (Stage C, until CI carries): on a publishable run, when the plan says this image could be carried, the fresh rebuild
  # is compared with the base the plan found; the result is only an annotation (title burn-in) for scripts/burnin-status.sh.
  # Not scheduled: a later rebuild differs as soon as Alpine ships a newer apk package (see the Dockerfiles).
  reproducible:
    needs: [changes, docker]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: read }
    strategy:
      fail-fast: false
      matrix: { service: [backend, gateway, web, updater] }
    env:
      SERVICE: ${{ matrix.service }}
      PUBLISHABLE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    steps:
      # The change plan, checked before anything else (it runs before checkout): a plan that is missing, failed or does not
      # parse turns this job red, never skipped or green. The same step, byte for byte, in every job that reads the plan.
      - name: Plan
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLAN: ${{ needs.changes.outputs.plan }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ] || ! jq -e '.images' <<< "$PLAN" > /dev/null; then
            echo "::error::kein gültiger Plan (changes: $CHANGES_RESULT)"
            exit 1
          fi
          jq -c '.images | map_values({action, commit, time})' <<< "$PLAN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - name: Log in to GHCR
        if: env.PUBLISHABLE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Rebuild and compare with the pushed candidate
        if: env.PUBLISHABLE == 'true'
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"; img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${SERVICE}:ci-${GITHUB_SHA}"
          digest=$(scripts/reproduce-image.sh "$SERVICE" --compare "$img" --out "$RUNNER_TEMP/rebuilt.tar")
          echo "### $SERVICE reproduced: \`$digest\` (= $img, linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
      # Burn-in: would carrying the base have shipped the same image? Equal linux/amd64 manifests of ci-<sha> and the base: equal.
      # Otherwise the base is pulled and saved and `--diff` judges it against the rebuild: only OS-package files differ → counts;
      # app/ or the config differ (an input the map misses) → resets; no comparison possible → neutral ("kein Burn-in"). The
      # backend's media server pin label is ignored: its value is the digest of this run's mediaserver build (Stage D keeps it
      # equal). Annotations only: this step never fails the leg (continue-on-error, and every path exits 0), a red leg would hide
      # the run from the update check.
      - name: Burn-in (compare with the base)
        if: env.PUBLISHABLE == 'true' && fromJSON(needs.changes.outputs.plan).images[matrix.service].action == 'carry'
        continue-on-error: true
        env:
          BASE_DIGEST: ${{ fromJSON(needs.changes.outputs.plan).images[matrix.service].base.digest }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit # a failure inside $(…) fails the assignment, which the ERR trap turns into a reset
          neutral() { echo "::notice title=burn-in::$SERVICE kein Burn-in ($1)"; exit 0; }
          trap 'neutral "kein Vergleich möglich, Zeile $LINENO"' ERR
          repo="${GITHUB_REPOSITORY#*/}"; name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${repo,,}-${SERVICE}"
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || neutral "kein Basis-Digest im Plan"
          # the linux/amd64 image manifest digest of a ref (an index or a single manifest)
          amd64() {
            local raw; raw=$(docker buildx imagetools inspect --raw "$1")
            if jq -e 'has("manifests")' <<< "$raw" > /dev/null; then
              jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest' <<< "$raw"
            else
              docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
            fi
          }
          ours=$(amd64 "$name:ci-$GITHUB_SHA"); theirs=$(amd64 "$name@$BASE_DIGEST")
          if [ "$ours" = "$theirs" ]; then echo "::notice title=burn-in::$SERVICE gleich $theirs"; exit 0; fi
          docker pull -q --platform linux/amd64 "$name@$BASE_DIGEST" > /dev/null
          docker tag "$name@$BASE_DIGEST" "ff-burnin-base:$SERVICE"
          docker save -o "$RUNNER_TEMP/base.tar" "ff-burnin-base:$SERVICE"
          ignore=()
          if [ "$SERVICE" = backend ]; then ignore=(--ignore-label io.github.letsmanu.friendflix.mediaserver.pins); fi
          out=$(scripts/reproduce-image.sh --diff "$RUNNER_TEMP/rebuilt.tar" "$RUNNER_TEMP/base.tar" ${ignore[@]+"${ignore[@]}"})
          # file names and config values from the images are data, never workflow commands
          stop="burnin-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop"; echo "$out"; echo "::$stop::"
          cause=$(sed -n 's/^cause: //p' <<< "$out" | head -n1)
          pin=; if grep -q '^ignored: label ' <<< "$out"; then pin='; Medienserver-Pin ignoriert'; fi
          case "$(tail -n1 <<< "$out")" in
            'verdict: equal') echo "::notice title=burn-in::$SERVICE zählt (gleicher Inhalt$pin)" ;;
            'verdict: os-only') echo "::notice title=burn-in::$SERVICE zählt (nur OS-Pakete$pin)" ;;
            'verdict: app') echo "::warning title=burn-in::$SERVICE setzt zurück: ${cause:-?}" ;;
            *) neutral "kein Urteil von --diff" ;;
          esac
      - name: Build twice from scratch and compare
        if: env.PUBLISHABLE != 'true'
        env:
          # what both rebuilds are built for (reproduce-image.sh asks the ref's own changed-images.mjs; the plan says the same)
          IMAGE_COMMIT: ${{ fromJSON(needs.changes.outputs.plan).images[matrix.service].commit }}
        run: |
          set -euo pipefail
          a=$(scripts/reproduce-image.sh "$SERVICE" --out "$RUNNER_TEMP/a.tar")
          b=$(scripts/reproduce-image.sh "$SERVICE" --out "$RUNNER_TEMP/b.tar")
          if [ "$a" != "$b" ]; then
            echo "::error title=Not reproducible::$SERVICE: two clean builds of image commit $IMAGE_COMMIT differ ($a vs $b)"
            scripts/reproduce-image.sh --diff "$RUNNER_TEMP/a.tar" "$RUNNER_TEMP/b.tar"
            exit 1
          fi
          echo "### $SERVICE reproducible: two clean builds -> \`$a\`" >> "$GITHUB_STEP_SUMMARY"
  # vX.Y.Z tags (push, or release.yml's dispatch): the signed Android app (AAB + APK) and the Fire TV APK on the tag's
  # GitHub Release, when the upload key secrets exist (otherwise a notice), and only after the tests, e2e and the secret
  # scan passed.
  # contents: write only here, for the release upload.
  android-release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, e2e, secrets]
    permissions: { contents: write }
    uses: ./.github/workflows/android-release.yml
    secrets:
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
  # vX.Y.Z tags: the Windows app (setup .exe + .msi with the pinned mpv) on the tag's GitHub Release, signed for self-update
  # with latest.json when the update key secrets exist (otherwise unsigned with updates off, and a notice), and only after
  # the tests, e2e, the secret scan and the desktop jobs passed. contents: write only here, for the release upload.
  desktop-release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, e2e, secrets, desktop-core, desktop-app]
    permissions: { contents: write }
    uses: ./.github/workflows/desktop-release.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # vX.Y.Z tags: the Samsung TV app (FriendFlix + Probe .wgt, signed with the owner's Samsung certificates) on the tag's
  # GitHub Release when the four certificate secrets exist (otherwise a notice), and only after the tests, e2e, the secret
  # scan and tizen-check passed. Not in the needs of publish or android-release. contents: write only here, for the upload.
  tizen-release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, e2e, secrets, tizen-check]
    permissions: { contents: write }
    uses: ./.github/workflows/tizen-release.yml
    secrets:
      TIZEN_AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12 }}
      TIZEN_AUTHOR_PASSWORD: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
      TIZEN_DISTRIBUTOR_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12 }}
      TIZEN_DISTRIBUTOR_PASSWORD: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
  # vX.Y.Z tags: the LG webOS TV app (FriendFlix + Test .ipk, developer mode, no signing and no secrets) on the tag's GitHub
  # Release, only after the tests, e2e, the secret scan and webos-check passed. Not in the needs of publish or
  # android-release. contents: write only here, for the upload.
  webos-release:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, e2e, secrets, webos-check]
    permissions: { contents: write }
    uses: ./.github/workflows/webos-release.yml
  # images are only published after every check above passed (main -> nightly + sha, v* tags -> semver + latest for the highest)
  # signing/attesting (id-token, attestations) happens only here, i.e. only on push events
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: [test, e2e, dast, secrets, docker, reproducible]
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/publish.yml
  # the trial media server image: the same re-tag + cosign + attestations, as its own call that only needs its own image job
  # (and the shared checks), so it can fail alone; `publish` above never waits for it
  publish-mediaserver:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    needs: [test, e2e, dast, secrets, mediaserver-image]
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    uses: ./.github/workflows/publish.yml
    with:
      services: '["mediaserver"]'
