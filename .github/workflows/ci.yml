name: CI
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # 22 = web image runtime, 26 = backend/gateway image runtime
      matrix: { node: [22, 26] }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_USER: postgres, POSTGRES_DB: ff_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (prod, high+)
        if: matrix.node == 22
        run: npm audit --omit=dev --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [backend, gateway, web] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: friendflix-${{ matrix.service }}:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: friendflix-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
  # images are only published after every check above passed (main -> latest + sha, v* tags -> semver)
  publish:
    if: github.event_name == 'push'
    needs: [test, secrets, docker]
    permissions: { contents: read, packages: write }
    uses: ./.github/workflows/publish.yml
