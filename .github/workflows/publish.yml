name: Publish images
# Builds the three images and pushes them to GitHub Container Registry (ghcr.io/<owner>/friendflix-<service>).
# Tags: latest + short sha on main, vX.Y.Z on version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [backend, gateway, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/friendflix-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
