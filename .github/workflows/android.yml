# Android app CI: lint, unit tests and an unsigned release build (APK uploaded as artifact) on every PR (and push to main) that touches the
# apps (phone and Fire TV, android/firetv: also its APK as artifact, its manifest checked, no Google Play services), the web bridge it talks to, or this workflow. The instrumented tests run on an API 34 emulator (GitHub only; there is
# no emulator in the local sandbox). Signing keys live only in GitHub secrets and are used by android-release.yml (v* tags,
# called from ci.yml), never here.
# The app version comes from ../version.json at build time (android/buildSrc), so release bumps need no Android change.
name: Android
on:
  pull_request:
    paths:
      - "android/**"
      - "web/src/lib/native/**"
      - "version.json"
      - ".github/workflows/android.yml"
  # Also on main: PRs pass one by one against an older main, so only a run on main sees merged updates together.
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/src/lib/native/**"
      - "version.json"
      - ".github/workflows/android.yml"
concurrency:
  group: android-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      # gradle-wrapper.jar is a checked-in binary: check it against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Gradle cache; the wrapper's distributionSha256Sum is verified by Gradle itself.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # All modules (phone app and Fire TV app); the AAB only for the phone app.
      - name: Lint, unit tests, unsigned release build (APKs + phone AAB)
        run: ./gradlew lint testDebugUnitTest assembleRelease :app:bundleRelease
      # Fire OS has no Google Play services: the Fire TV app must not depend on them.
      - name: "Fire TV: no Google Play services"
        run: |
          set -euo pipefail
          ./gradlew -q :firetv:dependencies --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/firetv-deps.txt"
          if grep -q 'com.google.android.gms' "$RUNNER_TEMP/firetv-deps.txt"; then
            grep 'com.google.android.gms' "$RUNNER_TEMP/firetv-deps.txt"
            echo "::error::the Fire TV app's release runtime classpath contains Google Play services (com.google.android.gms)"; exit 1
          fi
      # Package, leanback launcher, banner, touchscreen not required, permissions, no Play services in manifest or dex.
      - name: "Fire TV: check the APK"
        run: bash firetv/check-apk.sh firetv/build/outputs/apk/release/firetv-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: friendflix-android-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: friendflix-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: friendflix-firetv-unsigned-apk
          path: android/firetv/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The emulator needs hardware acceleration (KVM) on the hosted Linux runner.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      # The emulator step only says "There were failing tests": print the failing tests from the JUnit XML and keep the reports.
      - name: Show failing instrumented tests
        if: failure()
        working-directory: .
        run: |
          find android/app/build/outputs/androidTest-results -name '*.xml' -print0 2>/dev/null | xargs -0 -r grep -h -B2 -A25 '<failure' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: friendflix-android-instrumented-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7
