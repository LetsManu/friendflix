# Android app CI: lint, unit tests and an unsigned release build (APK uploaded as artifact) on every PR that touches the
# app, the web bridge it talks to, or this workflow. The instrumented tests run on an API 34 emulator (GitHub only; there is
# no emulator in the local sandbox). Signing keys live only in GitHub secrets and are used by the release workflow, never here.
# The app version comes from ../version.json at build time (android/buildSrc), so release bumps need no Android change.
name: Android
on:
  pull_request:
    paths:
      - "android/**"
      - "web/src/lib/native/**"
      - "version.json"
      - ".github/workflows/android.yml"
concurrency:
  group: android-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      # Gradle cache; the wrapper's distributionSha256Sum is verified by Gradle itself.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Lint, unit tests, unsigned release build (APK + AAB)
        run: ./gradlew lint testDebugUnitTest assembleRelease bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: friendflix-android-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: friendflix-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The emulator needs hardware acceleration (KVM) on the hosted Linux runner.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
