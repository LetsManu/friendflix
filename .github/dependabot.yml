#
# Every Dependabot PR runs the full CI, so updates arrive as few, grouped PRs:
# - one PR per ecosystem and month for minor and patch updates (majors stay separate, they need a look of their own);
# - a version must be out for 7 days before it is proposed (cooldown), so a quick follow-up patch does not open a second PR;
# - no automatic rebase on every push to main (that re-ran CI on every open Dependabot PR after each merge). Dependabot
#   still rebases on a merge conflict; `@dependabot rebase` on a PR rebases it by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop # the Tauri CLI of the Windows release (own lockfile, not a workspace)
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    # The CLI must match the `tauri` crate in desktop/Cargo.lock, and nothing on a PR runs it (desktop-release is tag-only), so only
    # patch releases arrive on their own; a minor or major bump is done by hand together with the crate.
    ignore:
      - dependency-name: "@tauri-apps/cli"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      desktop-npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /webos # the webOS packaging CLI (dev-only, own lockfile, not a workspace)
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 1
    groups:
      webos-npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/backend, /gateway, /web, /updater, /livetv]
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  # the third-party images in compose.yaml and compose.prod.yaml (database, cache, the bundled media server and request
  # service; the socket proxy) are pinned by tag and digest: this entry proposes new tags and digests for them. Postgres and
  # Redis majors are ignored: a new Postgres major needs a dump and restore (docs/operations.md), so it is done by hand.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
  # the trial media server image (mediaserver/README.md): a new Ferrofin release arrives as its own PR, which is only the
  # reminder: finish it by hand (labels, NOTICE, try.sh/probe.sh, probe on the Intel host, FriendFlix test) before merging
  - package-ecosystem: docker
    directory: /mediaserver
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 1
  # the pinned official Jellyfin release of the managed media server (mediaserver/pins/jellyfin/Dockerfile, never built): a new
  # release arrives as its own PR; CI reads the file into the backend image's pin label (scripts/mediaserver-pins.sh)
  - package-ecosystem: docker
    directory: /mediaserver/pins/jellyfin
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 1
  # the workflows and the local composite actions (.github/actions/build-image pins setup-buildx, build-push, metadata)
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
