version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /gateway
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /web
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /updater
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
  - package-ecosystem: gradle
    directory: /android
    open-pull-requests-limit: 5
    schedule: { interval: weekly }
    ignore:
      # androidx.core 1.19 needs compileSdk 37, which breaks the Robolectric tests; move SDK and tests together in one PR first.
      - dependency-name: androidx.core:core-ktx
        versions: [">=1.19.0"]
