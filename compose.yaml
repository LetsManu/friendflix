# FriendFlix portal stack.
# - NPM runs OUTSIDE Docker (or in its own stack) and reaches the portal through three ports that are bound to
#   127.0.0.1 only (BIND_ADDR): web, backend (API/auth/WebSocket) and gateway (/media). Nothing else is published.
# - Jellyfin/Seerr have NO ports and are only reachable via the internal `media` network.
# - `db` network is internal (no egress, no host access).
# NPM proxy host -> 127.0.0.1:${WEB_PORT}; locations /api,/auth,/ws -> :${BACKEND_PORT}, /media -> :${GATEWAY_PORT}
# (ready-made config: deploy/npm/portal.advanced.conf).

name: friendflix

networks:
  # `front` is a normal bridge: Docker can only publish ports for containers that sit on a non-internal network
  front: {}
  db:
    internal: true
  media:
    internal: true
  egress: {} # outbound internet for Jellyfin/Seerr metadata only; nothing is published

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: friendflix
      POSTGRES_USER: friendflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendflix"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--save", "", "--appendonly", "no"]
    read_only: true
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: friendflix-backend:dev
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?}
      DATABASE_URL: postgres://friendflix:${POSTGRES_PASSWORD}@postgres:5432/friendflix
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_ENC_KEY: ${APP_ENC_KEY:-}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ADMIN_GROUP: ${ADMIN_GROUP:-friendflix-admins}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-7200}
      OIDC_ISSUER: ${OIDC_ISSUER:?}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      JELLYFIN_URL: ${JELLYFIN_URL:?}
      JELLYFIN_ADMIN_API_KEY: ${JELLYFIN_ADMIN_API_KEY:-}
      OIDC_ALLOW_INSECURE: ${OIDC_ALLOW_INSECURE:-false}
      SEERR_URL: ${SEERR_URL:?}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
      NTFY_URL: ${NTFY_URL:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      AUTHENTIK_URL: ${AUTHENTIK_URL:-}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      AUTHENTIK_ENROLL_FLOW: ${AUTHENTIK_ENROLL_FLOW:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-3081}:3000"]
    networks: [front, db, media, egress] # egress: OIDC discovery + ntfy/Discord

  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    image: friendflix-gateway:dev
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      JELLYFIN_URL: ${JELLYFIN_URL:?}
      BACKEND_URL: http://backend:3000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on: [backend]
    ports: ["${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-3082}:4000"]
    networks: [front, media]

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    image: friendflix-web:dev
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      ORIGIN: ${PUBLIC_URL:?}
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3080}:3000"]
    networks: [front]

  # Daily pg_dump sidecar: `docker compose --profile backup up -d backup`
  # Host dir must be writable by uid 70:  mkdir -p backups && chown 70 backups
  backup:
    profiles: [backup]
    image: postgres:17-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      KEEP_DAYS: ${KEEP_DAYS:-14}
    volumes: ["${BACKUP_PATH:-./backups}:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while true; do
          f=/backups/friendflix-$$(date -u +%Y%m%dT%H%M%SZ).dump
          pg_dump -h postgres -U friendflix -Fc friendflix > $$f.tmp && [ -s $$f.tmp ] && mv $$f.tmp $$f || rm -f $$f.tmp
          find /backups -name 'friendflix-*.dump' -mtime +$${KEEP_DAYS} -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }
    networks: [db]

  # Optional bundled media services. Remove this profile if you already run them;
  # then attach your existing containers to the `friendflix_media` network instead.
  jellyfin:
    profiles: [bundled]
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_PATH:-./media}:/media:ro
    networks: [media, egress] # no ports, no NPM host (Plan B: see compose.planb.yaml)

  seerr:
    profiles: [bundled]
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    volumes: [seerr-config:/app/config]
    networks: [media, egress]

volumes:
  pgdata:
  jellyfin-config:
  jellyfin-cache:
  seerr-config:
