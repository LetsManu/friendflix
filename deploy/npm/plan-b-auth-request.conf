# NOTE: documented design only - the backend endpoint (GET, cookie based, for NPM) is NOT implemented yet. See docs/operations.md.
# PLAN B: if the Gateway becomes the bottleneck, NPM serves /media/ directly from Jellyfin
# after the portal authorizes each request. Jellyfin must then be reachable from NPM's network
# (attach it to a dedicated network shared ONLY with NPM, still no host port).
# Trade-off: the Jellyfin token must be injected by Nginx (header from auth_request response),
# so the portal's /internal/authz returns X-Jellyfin-Token only to Nginx, never to the browser.

location /media/ {
    auth_request /_authz;
    auth_request_set $jf_token $upstream_http_x_jellyfin_token;
    auth_request_set $jf_path  $upstream_http_x_jellyfin_path;
    proxy_set_header Authorization 'MediaBrowser Token="$jf_token"';
    proxy_pass http://jellyfin:8096$jf_path$is_args$args;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Range $http_range;
    proxy_read_timeout 3600s;
}

location = /_authz {
    internal;
    proxy_pass http://backend:3000/internal/authz;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
}
