# NPM -> Proxy Host "portal.example.com" -> Advanced tab (custom Nginx configuration)
# Proxy Host: Forward Hostname = web, Port 3000 (SvelteKit UI), scheme http,
# "Websockets Support" ON, "Block Common Exploits" ON, SSL: Force SSL + HTTP/2 + HSTS.
# NPM must be attached to the Docker network ${NPM_NETWORK} so it can resolve web/backend/gateway.

# ---- API + login: backend ----
location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}
location /auth/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# (Alternative Plan B: nginx serves /media/ itself -> deploy/npm/plan-b-auth-request.conf, replaces this block)
# ---- Video/image/subtitle traffic goes to the Gateway: no buffering, Range passthrough ----
location /media/ {
    proxy_pass http://gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    client_max_body_size 1m;
}

# ---- Watch party / now-playing WebSockets ----
location /ws/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- Webhooks from Jellyfin/Seerr use the internal network, never the public host ----
location /internal/ { return 404; }
location /metrics { return 404; }
location /health/ready { return 404; }
